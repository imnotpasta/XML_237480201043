<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách đơn vị</title>
</head>
<body>

    <h2>Danh sách các đơn vị</h2>
    <ul id="danhsach"></ul>

    <script>
        fetch("danhsachnhanvien.xml")
            .then(response => response.text())
            .then(data => {
                const parser = new DOMParser();
                const xml = parser.parseFromString(data, "text/xml");

                const nhanviens = xml.getElementsByTagName("nhanvien");
                const danhsach = document.getElementById("danhsach");

                for (let nv of nhanviens) {
                    const donvi = nv.getElementsByTagName("donvi")[0]
                                     .textContent.trim();

                    const li = document.createElement("li");
                    li.textContent = donvi;
                    danhsach.appendChild(li);
                }
            });
    </script>

</body>
</html>
