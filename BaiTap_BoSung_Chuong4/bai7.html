<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bài 7</title>
</head>

<body>

    <h2>Bài 7: Thêm sách bằng appendChild()</h2>

    <div id="result"></div>

    <script>

        // Chuỗi XML ban đầu
        var xml = `
            <bookstore>
                <book>
                    <title>Everyday Italian</title>
                    <price>30.00</price>
                </book>

                <book>
                    <title>Harry Potter</title>
                    <price>29.99</price>
                </book>
            </bookstore>
        `;

        // Chuyển chuỗi XML thành XML DOM
        var parser = new DOMParser();
        var xmlDoc = parser.parseFromString(xml, "text/xml");

        // Lấy thẻ bookstore
        var bookstore = xmlDoc.getElementsByTagName("bookstore")[0];

        // Tạo book mới
        var book = xmlDoc.createElement("book");

        // Tạo title
        var title = xmlDoc.createElement("title");
        title.textContent = "Learning JavaScript";

        // Tạo price
        var price = xmlDoc.createElement("price");
        price.textContent = "35.00";

        // Thêm title và price vào book
        book.appendChild(title);
        book.appendChild(price);

        // Thêm book mới vào bookstore
        bookstore.appendChild(book);

        // Hiển thị kết quả
        var result = "";

        var books = xmlDoc.getElementsByTagName("book");

        for (var i = 0; i < books.length; i++) {

            var tenSach = books[i]
                .getElementsByTagName("title")[0]
                .textContent;

            var gia = books[i]
                .getElementsByTagName("price")[0]
                .textContent;

            result +=
                "Tên sách: " + tenSach +
                " - Giá: " + gia +
                "<br>";
        }

        document.getElementById("result").innerHTML = result;

    </script>

</body>
</html>
